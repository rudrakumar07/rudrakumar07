name: Generate Profile Metrics

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Metrics (Classic)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: rudrakumar07
          template: classic
          base: header,activity,community,repositories,metadata
          plugins: |
            isocalendar
            languages
            habits
            notable
            achievements
            repositories
            lines
            topics
            stars
          options: |
            base.header.height: 0
            template: classic
            timezone: Asia/Kolkata
            isocalendar.duration: half-year

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: rudrakumar07
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=58a6ff&color_dots=0d1117,0d1117,0e75b6,58a6ff,58a6ff

  activity-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Activity Graph
        uses: ashutosh00710/github-readme-activity-graph@main
        with:
          USERNAME: rudrakumar07
          BG_COLOR: 0d1117
          COLOR: 58a6ff
          LINE: 0e75b6
          POINT: ffffff
          AREA: true
          AREA_COLOR: 0e75b6
          HIDE_BORDER: true
